<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberRiskGuardian Desktop</title>
<meta name="description" content="CyberRiskGuardian with Threat Live-feed — organization workspaces, scenario register and editor, risk calculator, ATT&CK threats, CVE/CWE vulnerabilities, threat-context snapshots, recommendations, KRI dashboard, budget arbitrage, risk mitigation from ISO 27002 / NIST / CIS controls, risk register, threat feeds and social media, compliance, information assets and Excel export.">
<meta name="theme-color" content="#0F2A44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">

<body>

<nav aria-label="Sections">
  <div class="brand">
    <img src="icons/icon-64.png" alt="" width="30" height="30">
    <b>CyberRiskGuardian<span>with Threat Live-feed</span></b>
    <button type="button" class="btn ghost sm" id="nav-rail" aria-pressed="false" title="Collapse the menu">«</button>
  </div>
  <div id="navtree"></div>

  <div class="spacer"></div>
  <div class="foot">
    <div id="engine-state">engine loading…</div>

  </div>

      <button class="btn ghost sm danger" id="exit-btn" title="Save, stop the local helper and close the app">Exit</button>
    </div>
  </header>
  <main id="main">
    <div id="engine-banner"></div>
    <section id="panel-process" hidden></section>

    <section id="panel-compliance" hidden></section>
