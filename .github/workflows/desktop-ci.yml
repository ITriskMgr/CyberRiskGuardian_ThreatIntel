# CyberRiskGuardian Desktop — gates, helper tests, engine regression and the browser suites (1.9.0).
# Runs the application exactly as the launcher does (python3 serve.py), against CRGO 0.11.2 (tag v0.11.2), with canned AI answers
# (desktop/tests/mock, copied to $CRG_TMP/mock for the run) — no key, no model and no network beyond the checkouts and the installs below.
name: desktop-ci
on:
  push:
    branches: [main, "release/**"]
    paths: ["desktop/**", "plugins/**", ".claude-plugin/**", "requirements.txt", ".github/workflows/desktop-ci.yml"]
  pull_request:
    paths: ["desktop/**", "plugins/**", ".claude-plugin/**", "requirements.txt", ".github/workflows/desktop-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # The CRGO ref the suites run against
      CRGO_REF: v0.11.2
      CRGO_RELEASE: "0.11.2"
      CRG_URL: http://127.0.0.1:8101/
      CRGO_HOME: ${{ github.workspace }}/CyberRiskGuardian-Ontology-0.11.2
      CRG_MOCK_GITHUB_PORT: "8199"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # CRG_TMP lies outside the checkout: the helper refuses an organisation-graph folder inside a git repository
      # (t12, t21). Set here, not in the job env, because the runner context is not available at job level.
      - name: Temp folder outside the checkout
        run: echo "CRG_TMP=$RUNNER_TEMP/crg-ci" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CRGO ${{ env.CRGO_RELEASE }} (${{ env.CRGO_REF }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ITriskMgr/CyberRiskGuardian-Ontology
          ref: ${{ env.CRGO_REF }}
          path: CyberRiskGuardian-Ontology-0.11.2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # 1.9.2: LibreOffice (soffice) recalculates the exported workbooks in t61; without it the suite fails its availability check
      - name: LibreOffice Calc (headless)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc-nogui
          soffice --version
      # 1.9.2 (NV-087): every package pinned with its SHA-256 hash (desktop/tests/requirements-ci.lock, generated from
      # requirements.txt + requirements-ci.txt for CPython 3.12/3.13 on linux x86_64); pip refuses anything else.
      - name: Python dependencies (pinned, hash-checked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r desktop/tests/requirements-ci.lock
      # 1.9.2 (NV-087): the committed package-lock.json is the source of truth — `npm ci` installs exactly it and fails on drift.
      - name: Playwright (Chromium)
        working-directory: desktop/tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # 1.9.2 (NV-087): known vulnerabilities in the pinned dependencies are reported on every run (advisory: they fail
      # the job only at high severity, so a new advisory is seen without blocking an unrelated change)
      - name: Dependency audit (pip-audit, npm audit)
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r desktop/tests/requirements-ci.lock --require-hashes --strict || echo "::warning::pip-audit found advisories (see above)"
          (cd desktop/tests && npm audit --omit=dev --audit-level=high) || echo "::warning::npm audit found advisories (see above)"
      - name: Gates
        working-directory: desktop/app
        run: |
          python tools/version_check.py
          python tools/ai_policy_check.py
          python tools/writer_tree_hash.py --check
          python tools/cache_check.py
          python tools/label_check.py
          python tools/history_check.py
          python tools/anchor_check.py
          python tools/i18n_coverage.py fr --strict
          python tools/csp_check.py
          python tools/route_code_check.py
          # IPC.CRGO is filled from CRGO 0.11 (bundled 0.11.2): no placeholder may come back, every identifier must exist in CRGO
          python tools/crgo_tbd_check.py --release --crgo "$CRGO_HOME"
      - name: Engine regression (MediBec 84,305 / 41,023), CRGO bridge and SSVC tables
        working-directory: plugins/cyberriskguardian-threatintel/skills/cyber-risk-assessment/scripts
        run: |
          python test_crg_calc.py
          python test_crgo_contract.py --crgo "$CRGO_HOME"
          python -I test_ssvc.py
          # 1.9.2 (X-1, X-2): one engine rule set — the shared conformance test against the plugin engine and its MCP server
          python test_cross_engine.py
      - name: SSVC tables and eval graders (plugin 1.7.2)
        run: |
          python scripts/ssvc_compare.py
          python scripts/build_evals.py --replay
      - name: Helper guard tests
        run: python -m unittest discover -s desktop/tests -p "test_*.py" -v
      - name: Browser suites
        working-directory: desktop/tests
        run: bash run_all.sh
      - name: Helper log
        if: failure()
        run: cat "$CRG_TMP"/serve-*.log || true
      - name: The suites left the repository's canned answers untouched
        if: always()
        run: git diff --exit-code -- desktop/tests/mock && test -z "$(git status --porcelain -- desktop/tests/mock)"
